{% load static %}
<!doctype html>
<html lang="en" data-site-font="{{ site_presentation.font_family }}" data-site-shadow="{{ site_presentation.shadow }}" data-site-backdrop="{{ site_presentation.backdrop }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Account · AugmentrART{% endblock %}</title>
  <script>
    (function () {
      var preference = 'system';
      try {
        var stored = window.localStorage.getItem('augmentrart:theme-preference:v1');
        if (stored === 'light' || stored === 'dark' || stored === 'system') preference = stored;
      } catch (_) {}
      var dark = preference === 'dark';
      if (preference === 'system') {
        try { dark = window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (_) {}
      }
      var root = document.documentElement;
      root.dataset.theme = dark ? 'dark' : 'light';
      root.dataset.themePreference = preference;
      root.style.colorScheme = dark ? 'dark' : 'light';
    })();
  </script>
  <style>
    @font-face { font-family: 'Pinyon Script'; font-style: normal; font-weight: 400; font-display: swap; src: url('/assets/fonts/pinyon-script-latin.woff2') format('woff2'); }
    @font-face { font-family: Lora; font-style: normal; font-weight: 400 700; font-display: swap; src: url('/assets/fonts/lora-normal-latin.woff2') format('woff2'); }
    @font-face { font-family: Lora; font-style: italic; font-weight: 400 700; font-display: swap; src: url('/assets/fonts/lora-italic-latin.woff2') format('woff2'); }
    :root {
      --bg: {{ site_theme_css.light.bg }};
      --code-bg: {{ site_theme_css.light.surface }};
      --text-h: {{ site_theme_css.light.text_h }};
      --text: {{ site_theme_css.light.text }};
      --accent: {{ site_theme_css.light.accent }};
      --accent-foreground: {{ site_theme_css.light.accent_foreground }};
      --sans: {{ site_theme_presentation_tokens.sans|safe }};
      --site-font: {{ site_theme_presentation_tokens.site_font|safe }};
      --heading: {{ site_theme_presentation_tokens.heading|safe }};
      --site-density: {{ site_theme_presentation_tokens.density }};
      --site-radius: {{ site_theme_presentation_tokens.radius }};
      --site-border-style: {{ site_theme_presentation_tokens.border_style }};
      --border: color-mix(in srgb, var(--text) 28%, var(--bg));
      --accent-bg: color-mix(in srgb, var(--accent) 14%, var(--bg));
      --accent-border: color-mix(in srgb, var(--accent) 45%, var(--bg));
      --shadow: none;
      color-scheme: light dark;
      font-family: var(--site-font);
      color: var(--text-h);
      background: var(--bg);
    }
    :root[data-theme="dark"] {
      --bg: {{ site_theme_css.dark.bg }};
      --code-bg: {{ site_theme_css.dark.surface }};
      --text-h: {{ site_theme_css.dark.text_h }};
      --text: {{ site_theme_css.dark.text }};
      --accent: {{ site_theme_css.dark.accent }};
      --accent-foreground: {{ site_theme_css.dark.accent_foreground }};
      color-scheme: dark;
    }
    :root[data-site-shadow="soft"] { --shadow: color-mix(in srgb, var(--text-h) 20%, var(--bg)) 0 8px 18px -4px; }
    :root[data-site-shadow="offset"] { --shadow: 4px 4px 0 var(--border); }
    :root[data-site-backdrop="gradient"] body,
    :root[data-site-backdrop="cosmic"] body {
      background: linear-gradient(145deg, color-mix(in srgb, var(--accent) 12%, var(--bg)), var(--bg) 58%);
    }
    :root[data-site-backdrop="cosmic"] body { background: radial-gradient(ellipse at top, color-mix(in srgb, var(--accent) 16%, var(--bg)), var(--bg) 68%); }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--text-h); font: 1rem/1.5 var(--site-font); }
    header { padding: calc(var(--site-density) * 2) 24px; border-bottom: 1px var(--site-border-style) var(--border); background: color-mix(in srgb, var(--bg) 92%, transparent); text-align: center; }
    header a { color: var(--text-h); text-decoration: none; font-family: var(--heading); font-weight: 700; font-size: 2rem; }
    main { width: min(100% - 32px, 480px); margin: auto; padding: calc(var(--site-density) * 2) 0; flex: 1; display: flex; align-items: center; }
    .card { width: 100%; background: var(--code-bg); border: 1px var(--site-border-style) var(--border); border-radius: var(--site-radius); padding: var(--site-density); box-shadow: var(--shadow); }
    h1 { margin: 0 0 8px; color: var(--text-h); font-family: var(--heading); font-size: 1.875rem; line-height: 1.2; }
    .intro { margin: 0 0 var(--site-density); color: var(--text); }
    label { display: block; margin: var(--site-density) 0 6px; color: var(--text-h); font-weight: 600; }
    input { width: 100%; padding: 11px 12px; border: 1px var(--site-border-style) var(--border); border-radius: var(--site-radius); background: var(--bg); color: var(--text-h); font: inherit; }
    input::placeholder { color: var(--text); opacity: 1; }
    input:focus, button:focus, a:focus { outline: 3px solid var(--text-h); outline-offset: 2px; }
    button, .google { display: block; width: 100%; min-height: 44px; margin-top: var(--site-density); padding: 10px 16px; border: 1px var(--site-border-style) var(--accent-border); border-radius: var(--site-radius); background: var(--accent); color: var(--accent-foreground); font: inherit; font-weight: 700; text-align: center; text-decoration: none; cursor: pointer; }
    button:hover { background: color-mix(in srgb, var(--accent) 90%, var(--bg)); }
    .google { margin-top: 12px; background: var(--accent-bg); border-color: var(--accent-border); color: var(--text-h); }
    .google:hover { background: color-mix(in srgb, var(--accent-bg) 70%, var(--text-h)); }
    .links { margin-top: var(--site-density); text-align: center; }
    .links a { color: var(--text-h); text-decoration-color: var(--accent); text-underline-offset: .2em; }
    .errorlist { padding: 10px 12px; margin: 8px 0; border: 1px var(--site-border-style) var(--accent-border); border-radius: var(--site-radius); background: var(--accent-bg); color: var(--text-h); }
    .messages { color: var(--text-h); }
    footer { padding: var(--site-density); text-align: center; border-top: 1px var(--site-border-style) var(--border); color: var(--text); font-size: 14px; }
    @media (max-width: 520px) { header { padding: var(--site-density) 16px; } .card { padding: var(--site-density); } main { padding: var(--site-density) 0; } }
    @media (prefers-reduced-motion: no-preference) { button, a { transition: background-color .15s ease, color .15s ease; } }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header><a href="/">AugmentrART</a></header>
  <main><section class="card">{% block content %}{% endblock %}</section></main>
  <footer>Christopher Fornesa © {% now "Y" %}</footer>
</body>
</html>
