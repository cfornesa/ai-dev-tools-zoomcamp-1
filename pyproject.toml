[project]
name = "gesture-reactive-studio"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1",
    "djangorestframework>=3.18.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
]

[tool.pytest.ini_options]
# config.test_settings supplies safe, non-secret default values for the
# required environment variables config.settings needs (see
# config/test_settings.py for why this can't just be a conftest.py), then
# defers to config.settings for everything else.
DJANGO_SETTINGS_MODULE = "config.test_settings"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
