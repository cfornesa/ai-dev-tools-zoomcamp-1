      description: No request body, no `client_request_id` idempotency key yet, and no `renderer` choice — `scene3d.schema.json` has no `renderer.preferred` concept.
      x-access: session
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project3D" }
        "401":
          description: Not signed in.

  /api/projects3d/{projectId}/:
    get:
      tags: [Projects3D]
      operationId: getProject3D
      summary: Fetch one 3D project
      description: Project3D has no `visibility` field yet, so this is unconditionally owner-only.
