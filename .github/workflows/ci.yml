name: CI

on:
  push:
    branches: [main]
  pull_request:
  deployment_status:

jobs:
  workflow-validation:
    name: Workflow validation
    if: ${{ github.event_name != 'deployment_status' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate GitHub Actions workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2

      - name: Check GitHub Action pins
        run: python scripts/check-github-action-pins.py

      - name: Check live provider alert contract
        run: python scripts/check-live-provider-alert.py

  backend:
    name: Backend checks
    if: ${{ github.event_name != 'deployment_status' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy .

      - name: Test (pytest)
        run: uv run pytest

  frontend:
    name: Frontend checks
    if: ${{ github.event_name != 'deployment_status' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check

      - name: Type check (tsc)
        run: npm run typecheck

      - name: Test (vitest)
        run: npm test

  published-smoke:
    name: Published routing smoke check
    # A successful deployment status is emitted after publishing. For normal
    # CI runs, retain the repository-variable check for an already-published
    # instance. The probe is anonymous by design.
    if: >-
      ${{
        (github.event_name == 'deployment_status' &&
          github.event.deployment_status.state == 'success' &&
          (github.event.deployment_status.environment_url != '' ||
            github.event.deployment_status.target_url != '')) ||
        (github.event_name != 'deployment_status' && vars.PUBLISHED_APP_URL != '')
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Check published routing
        env:
          PUBLISHED_APP_URL: >-
            ${{
              github.event.deployment_status.environment_url ||
              github.event.deployment_status.target_url ||
              vars.PUBLISHED_APP_URL
            }}
        run: scripts/smoke-published.sh

  published-routing-disposable:
    name: Disposable published routing smoke check
    # This job deliberately exercises the published serving path locally. It
    # never uses the deployment-status URL or a repository/shared database.
    if: ${{ github.event_name != 'deployment_status' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: creatrweb_published_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d creatrweb_published_smoke"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # All values in this job are disposable CI-only configuration. In
      # particular, this database exists only inside the GitHub job service.
      DJANGO_SECRET_KEY: ci-only-published-routing-secret-key
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/creatrweb_published_smoke
      GOOGLE_OAUTH_CLIENT_ID: ci-published-routing.apps.googleusercontent.com
      GOOGLE_OAUTH_CLIENT_SECRET: ci-only-published-routing-oauth-secret
      MISTRAL_CREDENTIAL_ENCRYPTION_KEY: hDmcNCp7WCvpOjI3tmEd-foRjnnjh_-OgVogBK30V4=
      AI_PROVIDER: fake
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost:5000,http://127.0.0.1:5000
      RUN_MIGRATIONS_ON_START: "false"
      FRONTEND_SERVE_MODE: preview
      PORT: "5000"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.13"

      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Install and build frontend
        run: npm --prefix frontend ci && npm --prefix frontend run build

      - name: Apply migrations to disposable database
        working-directory: backend
        run: uv run python manage.py migrate --noinput

      - name: Start published-like runtime
        run: |
          scripts/start-production.sh > /tmp/published-routing.log 2>&1 &
          echo "$!" > /tmp/published-routing.pid

      - name: Run disposable published routing smoke check
        env:
          PUBLISHED_APP_URL: http://127.0.0.1:5000
          SMOKE_TIMEOUT_SECONDS: "30"
        run: scripts/smoke-published.sh

      - name: Upload published routing diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: published-routing-diagnostics
          if-no-files-found: ignore
          path: /tmp/published-routing.log

      - name: Stop published-like runtime
        if: ${{ always() }}
        run: |
          if [[ -f /tmp/published-routing.pid ]]; then
            kill "$(cat /tmp/published-routing.pid)" 2>/dev/null || true
          fi

  hosted-git-safe-push:
    name: Hosted safe-push smoke check
    # Repository administration and the credential are deliberately opt-in.
    # Without both settings this job exits with a safe SKIP.
    if: ${{ vars.HOSTED_GIT_SMOKE == 'true' }}
    runs-on: ubuntu-latest
    env:
      HOSTED_GIT_SMOKE: "1"
      HOSTED_GIT_OWNER: ${{ github.repository_owner }}
      GIT_URL: ${{ secrets.GIT_URL }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install GitHub CLI
        run: gh --version
      - name: Run disposable hosted Git smoke check
        run: scripts/smoke-hosted-git.sh

  staging-authenticated-smoke:
    name: Disposable staging authenticated smoke check
    # This job is deliberately separate from the anonymous published probe.
    # GitHub environment secrets below must belong to a disposable staging
    # database, never the production/shared deployment.
    if: >-
      ${{
        github.event_name == 'deployment_status' &&
        github.event.deployment_status.state == 'success' &&
        github.event.deployment_status.environment == 'staging' &&
        (github.event.deployment_status.environment_url != '' ||
          github.event.deployment_status.target_url != '')
      }}
    environment: staging
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ${{ secrets.STAGING_DJANGO_SECRET_KEY }}
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.STAGING_GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.STAGING_GOOGLE_OAUTH_CLIENT_SECRET }}
      MISTRAL_CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.STAGING_MISTRAL_CREDENTIAL_ENCRYPTION_KEY }}
      DJANGO_DEBUG: "False"
      BASE_URL: >-
        ${{
          github.event.deployment_status.environment_url ||
          github.event.deployment_status.target_url
        }}
      E2E_FIXTURE_ENVIRONMENT: disposable-staging
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Write disposable staging environment
        run: |
          test -n "$DJANGO_SECRET_KEY" || { echo "Missing STAGING_DJANGO_SECRET_KEY"; exit 1; }
          test -n "$DATABASE_URL" || { echo "Missing STAGING_DATABASE_URL"; exit 1; }
          test -n "$GOOGLE_OAUTH_CLIENT_ID" || { echo "Missing STAGING_GOOGLE_OAUTH_CLIENT_ID"; exit 1; }
          test -n "$GOOGLE_OAUTH_CLIENT_SECRET" || { echo "Missing STAGING_GOOGLE_OAUTH_CLIENT_SECRET"; exit 1; }
          test -n "$MISTRAL_CREDENTIAL_ENCRYPTION_KEY" || { echo "Missing STAGING_MISTRAL_CREDENTIAL_ENCRYPTION_KEY"; exit 1; }
          python - "$DATABASE_URL" <<'PY'
          import sys
          from urllib.parse import urlparse

          parsed = urlparse(sys.argv[1])
          database_name = parsed.path.lstrip("/").lower()
          if parsed.scheme not in {"postgres", "postgresql"} or not parsed.hostname or not database_name:
              raise SystemExit("STAGING_DATABASE_URL must be a PostgreSQL URL with a host and database name")
          if any(marker in database_name for marker in ("prod", "production", "shared")):
              raise SystemExit("STAGING_DATABASE_URL points at a production or shared database")
          if not any(marker in database_name for marker in ("stage", "staging", "disposable", "e2e")):
              raise SystemExit("STAGING_DATABASE_URL database name must identify a disposable staging database")
          PY
          staging_host="${BASE_URL#*://}"
          staging_host="${staging_host%%/*}"
          staging_origin="${BASE_URL%/}"
          cat > backend/.env <<EOF
          DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
          DATABASE_URL=${DATABASE_URL}
          GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID}
          GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET}
          MISTRAL_CREDENTIAL_ENCRYPTION_KEY=${MISTRAL_CREDENTIAL_ENCRYPTION_KEY}
          DJANGO_DEBUG=${DJANGO_DEBUG}
          DJANGO_ALLOWED_HOSTS=${staging_host}
          CSRF_TRUSTED_ORIGINS=${staging_origin}
          EOF

      - name: Run authenticated staging smoke check
        env:
          STAGING_SMOKE: "1"
        run: |
          staging_host="${BASE_URL#*://}"
          staging_host="${staging_host%%/*}"
          STAGING_HOST="$staging_host" scripts/smoke-local.sh

  e2e-browser:
    name: Browser acceptance E2E
    if: ${{ github.event_name != 'deployment_status' }}
    runs-on: ubuntu-latest
    # The Playwright global setup creates disposable fixture users in this
    # service and removes them in global teardown. Never point this job at a
    # shared or production database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: creatrweb_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d creatrweb_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-only-e2e-secret-key
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/creatrweb_e2e
      GOOGLE_OAUTH_CLIENT_ID: ci-e2e-client.apps.googleusercontent.com
      GOOGLE_OAUTH_CLIENT_SECRET: ci-only-e2e-oauth-secret
      MISTRAL_CREDENTIAL_ENCRYPTION_KEY: hDmcNCp7WCvpOjI3tmEd0-foRjnnjh_-OgVogBK30V4=
      AI_PROVIDER: fake
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers and Linux dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Write CI environment file
        # globalSetup deliberately uses uv's --env-file behavior, matching
        # the documented local workflow; keep CI's disposable values in sync
        # with the job environment. Written to backend/.env now that the
        # backend package lives under backend/ (Task 217/issue #249);
        # E2E_ENV_FILE (below) points frontend/e2e's globalSetup at the same
        # absolute path since it no longer sits at the repo root.
        run: |
          cat > backend/.env <<'EOF'
          DJANGO_SECRET_KEY=ci-only-e2e-secret-key
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/creatrweb_e2e
          GOOGLE_OAUTH_CLIENT_ID=ci-e2e-client.apps.googleusercontent.com
          GOOGLE_OAUTH_CLIENT_SECRET=ci-only-e2e-oauth-secret
          MISTRAL_CREDENTIAL_ENCRYPTION_KEY=hDmcNCp7WCvpOjI3tmEd0-foRjnnjh_-OgVogBK30V4=
          AI_PROVIDER=fake
          DJANGO_DEBUG=True
          DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1
          EOF

      - name: Apply migrations
        working-directory: backend
        run: uv run --env-file .env python manage.py migrate --noinput

      - name: Start Django and Vite
        run: |
          (cd backend && uv run --env-file .env python manage.py runserver 0.0.0.0:8000) > /tmp/django-e2e.log 2>&1 &
          (cd frontend && npm run dev -- --host 0.0.0.0 --port 5000) > /tmp/vite-e2e.log 2>&1 &

      - name: Wait for both servers
        run: |
          timeout 60 bash -c '
            until curl --fail --silent http://localhost:8000/health/ &&
              curl --fail --silent http://localhost:5000/ >/dev/null; do
              sleep 1
            done
          '

      - name: Run WebKit fullscreen Escape regression
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:5000
        run: >-
          npm run test:e2e --
          e2e/manual2dStageChrome.spec.ts
          --project=webkit
          --grep "keeps the fullscreen command synchronized after browser Escape"

      - name: Run full browser acceptance suite
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:5000
        run: npm run test:e2e

      - name: Upload browser diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-e2e-diagnostics
          if-no-files-found: ignore
          path: |
            frontend/test-results/
            /tmp/django-e2e.log
            /tmp/vite-e2e.log
