              schema: { $ref: "#/components/schemas/AIErrorBody3D" }
        "424":
          description: No personal Mistral credential is configured for the caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIErrorBody3D" }
        "429":
          description: Request-rate limit or daily creation quota exceeded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIErrorBody3D" }
        "502":
          description: Any other provider/SDK/network failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIErrorBody3D" }
        "504":
          description: Mistral did not respond in time.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIErrorBody3D" }

  /api/projects3d/{projectId}/ai/edit-scene/:
    post:
      tags: [AI3D]
      operationId: editAIScene3D
      summary: Propose an edit to the caller's current in-progress 3D scene (draft only)
      description: The 3D counterpart of `editAIScene` — identical stale-base detection and failure taxonomy, scoped to `Project3D`/`scene3d`.
      x-access: owner
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AIEditScene3DInput" }
      responses:
        "200":
          description: Draft proposal generated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIEditScene3DResponse" }
        "400":
          description: "Invalid prompt/model, invalid current_scene, or cancelled operation."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIErrorBody3D" }
        "404":
          description: Does not exist, or exists but isn't the caller's.
        "409":
          description: "`base_version_id` no longer matches the project's current version."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIErrorBody3D" }
        "413":
          description: Raw provider response or patch exceeded the size safety net.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIErrorBody3D" }
        "422":
          description: "Empty/protected/unreferenced/invalid/malformed patch, patch failed to apply, or the resulting scene failed validation."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIErrorBody3D" }
        "424":
          description: No personal Mistral credential is configured for the caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIErrorBody3D" }
        "429":
          description: Request-rate limit or daily edit quota exceeded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIErrorBody3D" }
        "502":
          description: Any other provider/SDK/network failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIErrorBody3D" }
        "504":
          description: Mistral did not respond in time.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIErrorBody3D" }

  /api/projects3d/{projectId}/ai/accept-proposal/:
    post:
      tags: [AI3D]
      operationId: acceptAIProposal3D
      summary: Persist an already-generated 3D AI create/edit proposal as the next immutable version
      description: The 3D counterpart of `acceptAIProposal`, reusing `saveSceneVersion3D`'s exact transaction shape. Same idempotency semantics via optional `client_request_id`.
      x-access: owner
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcceptAIProposal3DInput" }
      responses:
        "200":
          description: A version already existing for this `client_request_id` was returned instead of creating a duplicate.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SceneVersion3D" }
        "201":
          description: New current version created from the accepted proposal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SceneVersion3D" }
        "400":
          description: Request body failed validation, or `scene_json` is not an object.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIErrorBody3D" }
        "404":
          description: Does not exist, or exists but isn't the caller's.
        "409":
          description: "`base_version_id` no longer matches the project's current version."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIErrorBody3D" }
        "422":
          description: "`scene_json` failed schema/limits validation."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIErrorBody3D" }

  /.well-known/oauth-authorization-server:
    get:
      summary: Discover the OAuth authorization server
      responses:
        "200": { description: RFC 8414 authorization-server metadata; only code/S256 and the supported OAuth scopes are advertised. }
  /.well-known/oauth-protected-resource/mcp/:
    get:
      summary: Discover authorization for the MCP protected resource
      responses:
        "200": { description: "RFC 9728 metadata for the MCP resource at the validated application host." }
  /oauth/authorize/:
    get:
      summary: Begin the MCP OAuth authorization-code flow
      description: Requires an existing allauth browser session, exact pre-registered redirect URI, resource=https://{host}/mcp, and PKCE S256. The user must explicitly approve requested scopes; public dynamic registration is disabled.
      x-access: session
      parameters:
        - { name: response_type, in: query, required: true, schema: { type: string, enum: [code] } }
        - { name: client_id, in: query, required: true, schema: { type: string } }
        - { name: redirect_uri, in: query, required: true, schema: { type: string, format: uri } }
        - { name: scope, in: query, required: true, schema: { type: string, description: "Space-separated gallery:read, projects:write, ai:use, and separately consented destructive scopes." } }
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: code_challenge, in: query, required: true, schema: { type: string } }
        - { name: code_challenge_method, in: query, required: true, schema: { type: string, enum: [S256] } }
        - { name: resource, in: query, required: true, schema: { type: string, format: uri } }
      responses:
        "302": { description: Consent page or redirect carrying the authorization code and state. }
        "400": { description: Invalid client, redirect URI, scope, resource or PKCE request. }
  /oauth/token/:
    post:
      summary: Exchange or refresh an MCP access token
      description: Supports authorization_code and refresh_token only. Authorization-code requests require the same exact redirect URI, S256 verifier, and MCP resource. Refresh tokens rotate.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type: { type: string, enum: [authorization_code, refresh_token] }
                code: { type: string }
                redirect_uri: { type: string, format: uri }
                client_id: { type: string }
                code_verifier: { type: string }
                refresh_token: { type: string }
                resource: { type: string, format: uri }
      responses:
        "200": { description: Short-lived audience-restricted token response; access and refresh credentials are never written to logs. }
        "400": { description: Invalid client, grant, resource, scope, or PKCE proof. }
  /oauth/revoke_token/:
    post:
      summary: Revoke an MCP OAuth token
      description: RFC 7009 revocation; a successfully revoked token is rejected on the next request.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
                token_type_hint: { type: string, enum: [access_token, refresh_token] }
      responses:
        "200": { description: Token revoked, or unknown token treated as already revoked. }
  /api/account/connected-apps/:
    get:
      summary: List the signed-in user's connected MCP applications
      security: [{ sessionCookie: [] }]
      x-access: session
      responses:
        "200":
          description: Applications with an active MCP access or refresh token; token values and client secrets are omitted.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, name, scopes, last_authorized]
                  properties:
                    id: { type: integer }
                    name: { type: string }
                    scopes: { type: array, items: { type: string } }
                    last_authorized: { type: string, format: date-time }
        "401": { description: Authentication required. }
  /api/account/connected-apps/{applicationId}/:
    delete:
      summary: Revoke only the signed-in user's tokens for one MCP application
      security: [{ sessionCookie: [] }]
      x-access: session
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Revoked status; foreign and unknown applications are indistinguishable. }
        "401": { description: Authentication required. }
  /api/admin/oauth-applications/:
    get:
      summary: List pre-registered MCP OAuth applications
      security: [{ sessionCookie: [] }]
      x-access: application-admin
      responses:
        "200": { description: Pre-registered client metadata without any secret. }
        "401": { description: Authentication required. }
        "403": { description: Application-admin authorization required. }
    post:
      summary: Pre-register an MCP public client
      security: [{ sessionCookie: [] }]
      x-access: application-admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, redirect_uris]
              properties:
                name: { type: string, maxLength: 255 }
                redirect_uris:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items: { type: string, format: uri }
      responses:
        "201": { description: Created public client ID and configured redirect URIs; no secret is returned. }
        "400": { description: Invalid name or unsafe/non-exact redirect URI. }
        "401": { description: Authentication required. }
        "403": { description: Application-admin authorization required. }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sessionid
      description: |
        Django session cookie, established by signing in through
        `/accounts/login/` (django-allauth). Unsafe methods additionally
        require the `X-CSRFToken` header, read from the `csrftoken` cookie
        — see `frontend/src/api/client.ts`. Operations reachable without a
        session set `security: []` and are marked `x-access: anonymous`.
    mcpOAuth:
      type: oauth2
      description: Authorization-code OAuth for external MCP clients. DCR is disabled; clients are pre-registered by application administrators.
      flows:
        authorizationCode:
          authorizationUrl: /oauth/authorize/
          tokenUrl: /oauth/token/
          scopes:
            gallery:read: Read public gallery content.
            projects:write: Read and modify the authenticated user's projects.
            ai:use: Use AI tools within the same web-app entitlements and quotas.
            destructive: Separately consent to destructive actions.

  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      description: A project's `public_id` (UUID).
      schema: { type: string, format: uuid }
    VersionId:
      name: versionId
      in: path
      required: true
      description: A `SceneVersion`/`SceneVersion3D` database id (integer, not the version's `sequence`).
      schema: { type: integer }
    TemplateId:
      name: templateId
      in: path
      required: true
      description: A template's `public_id` (UUID).
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      description: A per-browser-tab session id generated client-side (`sessionIdFor` in `frontend/src/pages/useDraftAutosave.ts`).
      schema: { type: string }

  schemas:
    MediaAssetDescriptor:
      type: object
      additionalProperties: false
      required: [id, name, mime, width, height]
      properties:
        id: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 200 }
        mime: { type: string, minLength: 1, maxLength: 100 }
        width: { type: integer, minimum: 1, maximum: 4096 }
        height: { type: integer, minimum: 1, maximum: 4096 }

    AIRunStartInput:
      type: object
      required: [target_type, operation, prompt]
      properties:
        target_type: { type: string, enum: [project, project3d] }
        project_id: { type: string, format: uuid }
        project3d_id: { type: string, format: uuid }
        operation: { type: string, enum: [create, edit_patch] }
        scope: { type: string, enum: [whole_scene, selection, add_layer] }
        selected_target_ids:
          type: array
          items: { type: string }
        prompt: { type: string, minLength: 1 }
        vendor: { type: string }
        model: { type: string }

    AIRun:
      type: object
      additionalProperties: true
      required: [id, status, scope, selected_target_ids, assets]
      properties:
        id: { type: integer }
        status: { type: string }
        scope: { type: string }
        selected_target_ids:
          type: array
          items: { type: string }
        assets:
          type: array
          items: { $ref: "#/components/schemas/MediaAssetDescriptor" }

    Detail:
      type: object
      properties:
        detail: { type: string }

    ValidationErrors:
      type: object
      description: DRF's default per-field validation error shape.
      additionalProperties:
        type: array
        items: { type: string }

    HealthResponse:
      type: object
      required: [status, database, cache]
      properties:
        status: { type: string, enum: [ok, error] }
        database: { type: string, enum: [ok, unavailable] }
        cache: { type: string, enum: [ok, unavailable] }

    CurrentUser:
      type: object
      required: [username, email]
      properties:
        username: { type: string }
        email: { type: string, format: email }

    Template:
      type: object
      required: [id, source_type, owner, name, category, description, created_at]
      properties:
        id: { type: string, format: uuid }
        source_type: { type: string, enum: [built_in, private] }
        owner:
          type: string
          nullable: true
          description: Username, or `null` for a built-in template.
        name: { type: string }
        category: { type: string }
        description: { type: string }
        created_at: { type: string, format: date-time }

    TemplateCreateInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 200 }
        category: { type: string, maxLength: 100, default: "" }
        description: { type: string, default: "" }

    Visibility:
      type: string
      enum: [private, public]

    Project:
      type: object
      required:
        - id
        - owner
        - title
        - description
        - tags
        - visibility
        - allow_public_remix
        - export_attribution
        - thumbnail_url
        - current_version
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        owner: { type: string, description: Owner's username. }
        title: { type: string }
        description: { type: string }
        tags: { type: array, items: { type: string } }
        visibility: { $ref: "#/components/schemas/Visibility" }
        allow_public_remix: { type: boolean }
        export_attribution: { type: boolean }
        thumbnail_url:
          type: string
          nullable: true
          description: "URL of the owner-facing thumbnail endpoint (GET .../thumbnail.png), or null if no current version exists."
        current_version:
          type: integer
          nullable: true
          description: The current `SceneVersion`'s database id, or null if no version has been saved yet.
        current_version_origin:
          type: string
          nullable: true
          description: "The current version's origin (manual/ai_create/ai_edit/restore/fork), or null when there is no current version. Optional field — may be absent on older clients/fixtures."
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ProjectMetadataInput:
      type: object
      description: All fields optional (partial update). `visibility` is deliberately not a field here.
      properties:
        title: { type: string }
        description: { type: string }
        tags: { type: array, items: { type: string } }
        allow_public_remix: { type: boolean }
        export_attribution: { type: boolean }

    CreateBlankProjectInput:
      type: object
      properties:
        client_request_id:
          type: string
          format: uuid
          description: Idempotency key. Omit to disable deduplication.
        renderer:
          type: string
          enum: [p5, canvas2d, svg]
          default: p5

    ForkProjectInput:
      type: object
      properties:
        client_request_id:
          type: string
          format: uuid
          description: Idempotency key. Omit to disable deduplication.

    SceneDocument:
      description: A canonical 2D scene document. See schema/README.md for the versioning/validation model.
      $ref: "./schema/scene.schema.json"

    SceneDocument3D:
      description: A canonical 3D (scene3d) document. See schema/README3d.md.
      $ref: "./schema/scene3d.schema.json"

    SceneVersion:
      type: object
      required:
        - id
        - sequence
        - origin
        - change_label
        - created_by
        - parent
        - fork_source_version
        - created_at
        - scene_json
      properties:
        id: { type: integer }
        sequence: { type: integer }
        origin: { type: string, enum: [manual, ai_create, ai_edit, restore, fork] }
        change_label: { type: string, nullable: true }
        created_by: { type: string, nullable: true, description: Username, or null for a system/anonymous write. }
        parent: { type: integer, nullable: true, description: The previous version's id this one was based on. }
        fork_source_version: { type: integer, nullable: true, description: Set only when origin is fork. }
        created_at: { type: string, format: date-time }
        scene_json: { $ref: "#/components/schemas/SceneDocument" }

    SceneVersionSummary:
      description: Every SceneVersion field except scene_json — the history list response deliberately omits the full document.
      type: object
      required:
        - id
        - sequence
        - origin
        - change_label
        - created_by
        - parent
        - fork_source_version
        - created_at
      properties:
        id: { type: integer }
        sequence: { type: integer }
        origin: { type: string, enum: [manual, ai_create, ai_edit, restore, fork] }
        change_label: { type: string, nullable: true }
        created_by: { type: string, nullable: true }
        parent: { type: integer, nullable: true }
        fork_source_version: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }

    SaveSceneVersionInput:
      type: object
      required: [scene_json, origin]
      properties:
        scene_json: { $ref: "#/components/schemas/SceneDocument" }
        origin:
          type: string
          enum: [manual, ai_create, ai_edit]
          description: "restore and fork are rejected here — they're only ever produced by their own dedicated endpoints."
        change_label: { type: string }

    SceneValidationErrorBody:
      type: object
      required: [errors]
      properties:
        errors:
          type: array
          items:
            type: object
            required: [path, rule, message]
            properties:
              path: { type: string }
              rule: { type: string }
              message: { type: string }

    PublishValidationErrorBody:
      type: object
      required: [errors]
      properties:
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

    RemixProvenance:
      type: object
      required: [source_creator, source_public_id]
      properties:
        source_creator:
          type: string
          description: The source project's current owner username. Always present even if the source has since gone private.
        source_public_id:
          type: string
          format: uuid
          nullable: true
          description: The source's id only when it is currently public/published/not deleted; null otherwise (durable attribution with no link).

    PublicGalleryProject:
      type: object
      required: [id, title, owner, thumbnail_url, remix_provenance, published_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        owner: { type: string }
        thumbnail_url: { type: string, nullable: true }
        remix_provenance:
          allOf: [{ $ref: "#/components/schemas/RemixProvenance" }]
          nullable: true
        published_at: { type: string, format: date-time }

    PublicGalleryPage:
      type: object
      required: [results, next_cursor, has_more]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/PublicGalleryProject" }
        next_cursor:
          type: string
          nullable: true
          description: "Null exactly when has_more is false."
        has_more: { type: boolean }

    PublicSceneVersion:
      type: object
      required: [sequence, scene_json, created_at]
      properties:
        sequence: { type: integer }
        scene_json: { $ref: "#/components/schemas/SceneDocument" }
        created_at: { type: string, format: date-time }

    PublicProject:
      type: object
      required:
        - id
        - owner
        - title
        - description
        - tags
        - allow_public_remix
        - thumbnail_url
        - remix_provenance
        - current_version
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        owner: { type: string }
        title: { type: string }
        description: { type: string }
        tags: { type: array, items: { type: string } }
        allow_public_remix: { type: boolean }
        thumbnail_url: { type: string, nullable: true }
        remix_provenance:
          allOf: [{ $ref: "#/components/schemas/RemixProvenance" }]
          nullable: true
        current_version:
          allOf: [{ $ref: "#/components/schemas/PublicSceneVersion" }]
          nullable: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DraftSyncPayload:
      type: object
      required: [draft_json, client_seq]
      properties:
        draft_json: { $ref: "#/components/schemas/SceneDocument" }
        client_seq:
          type: integer
          minimum: 0
          description: Monotonic per-(project, caller, session) write counter.

    DraftSyncResponse:
      type: object
      required: [draft_json, client_seq, last_autosaved_at, expires_at]
      properties:
        draft_json: { $ref: "#/components/schemas/SceneDocument" }
        client_seq: { type: integer }
        last_autosaved_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }

    DraftUpsertResponse:
      allOf:
        - $ref: "#/components/schemas/DraftSyncResponse"
        - type: object
          required: [applied]
          properties:
            applied:
              type: boolean
              description: False when this write was not newer than the already-stored draft and was therefore ignored.

    AIUsage:
      type: object
      required: [prompt_tokens, completion_tokens, total_tokens, estimated_cost_usd]
      properties:
        prompt_tokens: { type: integer }
        completion_tokens: { type: integer }
        total_tokens: { type: integer }
        estimated_cost_usd: { type: number }

    AICreateSceneInput:
      type: object
      required: [prompt]
      properties:
        prompt: { type: string, maxLength: 4000 }
        model:
          type: string
          maxLength: 100
          description: "Optional caller-chosen Mistral model id. Blank/omitted means \"use the account default\"."

    AICreateSceneResponse:
      type: object
      required: [draft, operation, scene, usage]
      properties:
        draft: { type: boolean, enum: [true] }
        operation: { type: string }
        scene: { $ref: "#/components/schemas/SceneDocument" }
        usage: { $ref: "#/components/schemas/AIUsage" }

    AIEditSceneInput:
      type: object
      required: [prompt, current_scene, base_version_id]
      properties:
        prompt: { type: string, maxLength: 4000 }
        current_scene: { $ref: "#/components/schemas/SceneDocument" }
        base_version_id:
          type: integer
          nullable: true
          description: The SceneVersion id the caller believes is still current; null for a project with no saved version yet.
        model: { type: string, maxLength: 100 }

    AIEditSceneResponse:
      type: object
      required: [draft, operation, patch, scene, change_summary, usage]
      properties:
        draft: { type: boolean, enum: [true] }
        operation: { type: string }
        patch:
          description: An RFC 6902 JSON Patch describing what changed. Already applied server-side to produce scene — never applied client-side.
        scene: { $ref: "#/components/schemas/SceneDocument" }
        change_summary: { type: string }
        usage: { $ref: "#/components/schemas/AIUsage" }

    AIErrorCode:
      type: string
      enum:
        - prompt_invalid
        - model_invalid
        - rate_limited
        - quota_exceeded
        - provider_quota_exceeded
        - timeout
        - cancelled
        - response_too_large
        - provider_failure
        - invalid_structured_output
        - current_scene_invalid
        - stale_base
        - empty_patch
        - protected_field
        - unreferenced_element
        - invalid_patch_path
        - malformed_patch
        - oversized_patch
        - patch_apply_failed
        - request_invalid
        - personal_key_required

    AIErrorBody:
      type: object
      required: [error, detail]
      properties:
        error: { $ref: "#/components/schemas/AIErrorCode" }
        detail: {}

    AcceptAIProposalInput:
      type: object
      required: [operation, scene_json, base_version_id]
      properties:
        operation: { type: string, enum: [ai_create, ai_edit] }
        scene_json: { $ref: "#/components/schemas/SceneDocument" }
        base_version_id: { type: integer, nullable: true }
        change_label: { type: string }
        client_request_id:
          type: string
          format: uuid
          nullable: true
          description: A UUID generated once per proposal (not per Accept click) so a retried/replayed Accept resolves to exactly one version.

    Project3D:
      type: object
      required: [id, owner, title, thumbnail_url, current_version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        owner: { type: string }
        title: { type: string }
        thumbnail_url: { type: string, nullable: true }
        current_version:
          allOf: [{ $ref: "#/components/schemas/SceneVersion3D" }]
          nullable: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SceneVersion3D:
      type: object
      required: [id, sequence, origin, scene_json, created_by, created_at]
      properties:
        id: { type: integer }
        sequence: { type: integer }
        origin: { type: string, enum: [manual, ai_create, ai_edit] }
        scene_json: { $ref: "#/components/schemas/SceneDocument3D" }
        created_by: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    SaveSceneVersion3DInput:
      type: object
      required: [scene_json]
      properties:
        scene_json: { $ref: "#/components/schemas/SceneDocument3D" }

    AICreateScene3DInput:
      type: object
      required: [prompt]
      properties:
        prompt: { type: string, maxLength: 4000 }
        model: { type: string, maxLength: 100 }

    AICreateScene3DResponse:
      type: object
      required: [draft, operation, scene, usage]
      properties:
        draft: { type: boolean, enum: [true] }
        operation: { type: string }
        scene: { $ref: "#/components/schemas/SceneDocument3D" }
        usage: { $ref: "#/components/schemas/AIUsage" }

    AIEditScene3DInput:
      type: object
      required: [prompt, current_scene, base_version_id]
      properties:
        prompt: { type: string, maxLength: 4000 }
        current_scene: { $ref: "#/components/schemas/SceneDocument3D" }
        base_version_id: { type: integer, nullable: true }
        model: { type: string, maxLength: 100 }

    AIEditScene3DResponse:
      type: object
      required: [draft, operation, patch, scene, change_summary, usage]
      properties:
        draft: { type: boolean, enum: [true] }
        operation: { type: string }
        patch: {}
        scene: { $ref: "#/components/schemas/SceneDocument3D" }
        change_summary: { type: string }
        usage: { $ref: "#/components/schemas/AIUsage" }

    AIErrorBody3D:
      type: object
      required: [error, detail]
      properties:
        error: { $ref: "#/components/schemas/AIErrorCode" }
        detail: {}

    AcceptAIProposal3DInput:
      type: object
      required: [operation, scene_json, base_version_id]
      properties:
        operation: { type: string, enum: [ai_create, ai_edit] }
        scene_json: { $ref: "#/components/schemas/SceneDocument3D" }
        base_version_id: { type: integer, nullable: true }
        client_request_id: { type: string, format: uuid, nullable: true }

    ArtPieceLibrary:
      type: string
      enum: [canvas2d, svg, threejs, aframe]

    ArtPieceGenerateInput:
      type: object
      required: [library, prompt]
      properties:
        library: { $ref: "#/components/schemas/ArtPieceLibrary" }
        prompt: { type: string, maxLength: 4000 }
        model: { type: string, maxLength: 100 }

    GenerateArtPieceResponse:
      type: object
      required: [library, code, usage]
      properties:
        library: { $ref: "#/components/schemas/ArtPieceLibrary" }
        code:
          type: string
          description: Raw, unvalidated generated markup/script — never executed server-side; only safe to render inside a sandboxed iframe.
        usage: { $ref: "#/components/schemas/AIUsage" }

    ArtPieceErrorCode:
      type: string
      enum:
        - prompt_invalid
        - model_invalid
        - rate_limited
        - quota_exceeded
        - provider_quota_exceeded
        - timeout
        - response_too_large
        - provider_failure
        - invalid_structured_output
        - personal_key_required

    ArtPieceErrorBody:
      type: object
      required: [error, detail]
      properties:
        error: { $ref: "#/components/schemas/ArtPieceErrorCode" }
        detail: {}

    PiecePackageIntakeInput:
      type: object
      required: [package]
      properties:
        package: { type: string, format: binary }
        idempotency_key: { type: string, maxLength: 128 }
        piece_id: { type: string, format: uuid }
        expected_revision: { type: integer, minimum: 1 }

    PiecePackageIntakeResponse:
      type: object
      required: [kind, public_id, version, visibility, media_count]
      properties:
        kind: { type: string, enum: [2d, 3d, generated] }
        public_id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        visibility: { type: string, enum: [private] }
        media_count: { type: integer, minimum: 0 }
