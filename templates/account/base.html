{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Account · Creatrweb Animation Studio{% endblock %}</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #27212f; background: #faf8fc; }
    * { box-sizing: border-box; } body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
    header { padding: 28px 24px; border-bottom: 1px solid #e5e4e7; background: white; }
    header a { color: inherit; text-decoration: none; font-weight: 700; }
    main { width: min(100% - 32px, 480px); margin: auto; padding: 40px 0; flex: 1; }
    .card { background: white; border: 1px solid #e5e4e7; border-radius: 12px; padding: 32px; box-shadow: 0 10px 25px #241b3210; }
    h1 { margin: 0 0 8px; font-size: 30px; } .intro { margin: 0 0 24px; color: #6b6375; }
    label { display: block; margin: 16px 0 6px; font-weight: 600; } input { width: 100%; padding: 11px 12px; border: 1px solid #aaa3b0; border-radius: 6px; font: inherit; }
    input:focus, button:focus, a:focus { outline: 3px solid #aa3bff66; outline-offset: 2px; }
    button, .google { display: block; width: 100%; min-height: 44px; margin-top: 22px; padding: 10px 16px; border: 0; border-radius: 6px; background: #7627b8; color: white; font: inherit; font-weight: 700; text-align: center; text-decoration: none; cursor: pointer; }
    .google { margin-top: 12px; background: white; border: 1px solid #aaa3b0; color: #27212f; } .links { margin-top: 24px; text-align: center; }
    .errorlist { padding: 10px 12px; margin: 8px 0; border-radius: 6px; background: #fff0f0; color: #9b1c1c; } .messages { color: #9b1c1c; }
    footer { padding: 24px; text-align: center; border-top: 1px solid #e5e4e7; color: #6b6375; font-size: 14px; }
    @media (max-width: 520px) { .card { padding: 24px 20px; } main { padding: 24px 0; } }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header><a href="/">Creatrweb Animation Studio</a></header>
  <main><section class="card">{% block content %}{% endblock %}</section></main>
  <footer>Christopher Fornesa © {% now "Y" %}</footer>
</body>
</html>
