  /api/public/projects/{projectId}/fork/:
    post:
      tags: [Public]
      operationId: forkProject
      summary: Atomically fork a public, remix-enabled project's current version into a new private project owned by the caller
      description: |
        Authentication is checked distinctly from every other denial here:
        an anonymous caller gets `401` (the source is already public, so
        there's no hidden-data concern in saying so); an authenticated
        caller who still can't fork it (private, or remixing disabled)
        gets `404`. Idempotent via optional `client_request_id`, reusing
        `Project.creation_request_id`'s uniqueness constraint — a repeated
        submission with the same id returns the original fork (`200`)
        instead of creating a duplicate.
      x-access: session
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForkProjectInput" }
      responses:
        "200":
          description: An existing fork with the same `client_request_id` was returned instead of creating a duplicate.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "201":
          description: Forked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400":
          description: Malformed `client_request_id`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationErrors" }
        "401":
          description: Not signed in.
        "404":
          description: Source project does not exist, is not public, or does not allow remixing.

  /api/projects/{projectId}/ai/create-scene/:
    post:
      tags: [AI]
      operationId: createAIScene
      summary: Generate a brand-new scene proposal from a text prompt (draft only)
      description: |
        Never creates a `SceneVersion` or touches `Project.current_version`
        in any branch, success or failure — the response is always an
        unsaved draft proposal for the frontend to preview and separately
        submit to accept-proposal. Requires the caller's own personal
        Mistral credential (`424` if none is configured). Subject to a
        per-user request-rate limit (`429 rate_limited`) and a per-user
        daily creation quota (`429 quota_exceeded`), independent of each
        other.
      x-access: owner
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AICreateSceneInput" }
      responses:
        "200":
          description: Draft proposal generated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AICreateSceneResponse" }
        "400":
          description: "Invalid prompt/model, `cancelled` operation."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIErrorBody" }
        "404":
          description: Does not exist, or exists but isn't the caller's.
        "413":
          description: Raw provider response exceeded the size safety net.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIErrorBody" }
        "422":
          description: Output failed schema/limits validation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIErrorBody" }
        "424":
          description: No personal Mistral credential is configured for the caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIErrorBody" }
        "429":
          description: Request-rate limit or daily creation quota exceeded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIErrorBody" }
        "502":
          description: Any other provider/SDK/network failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIErrorBody" }
        "504":
          description: Mistral did not respond in time.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIErrorBody" }

  /api/projects/{projectId}/ai/edit-scene/:
    post:
      tags: [AI]
      operationId: editAIScene
      summary: Propose an edit to the caller's current in-progress scene (draft only)
      description: |
        Sends the prompt and the caller's own working scene through a
        JSON-Patch-producing edit flow; the patch is applied to a copy and
        both the patch and the resulting scene are validated. Never creates
        a `SceneVersion`. `base_version_id` must equal the project's actual
        `current_version` id (both may be `null`) or the request is
        rejected with `409 stale_base` before any provider call — this
        detects a concurrent save/accept that moved the project's current
        version out from under the caller's working copy. Separate
        rate-limit/quota buckets from create-scene.
      x-access: owner
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AIEditSceneInput" }
      responses:
        "200":
          description: Draft proposal generated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIEditSceneResponse" }
        "400":
          description: "Invalid prompt/model, invalid current_scene, or cancelled operation."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIErrorBody" }
        "404":
          description: Does not exist, or exists but isn't the caller's.
        "409":
          description: "`base_version_id` no longer matches the project's current version."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIErrorBody" }
        "413":
          description: Raw provider response or patch exceeded the size safety net.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIErrorBody" }
        "422":
          description: "Empty/protected/unreferenced/invalid/malformed patch, patch failed to apply, or the resulting scene failed validation."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIErrorBody" }
        "424":
          description: No personal Mistral credential is configured for the caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIErrorBody" }
        "429":
          description: Request-rate limit or daily edit quota exceeded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIErrorBody" }
        "502":
          description: Any other provider/SDK/network failure.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIErrorBody" }
        "504":
          description: Mistral did not respond in time.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIErrorBody" }

  /api/projects/{projectId}/ai/accept-proposal/:
    post:
      tags: [AI]
      operationId: acceptAIProposal
      summary: Persist an already-generated AI create/edit proposal as the next immutable version
      description: |
        The only endpoint in the AI create/edit/accept trio that writes:
        creates exactly one new `SceneVersion` (`origin` `ai_create` or
        `ai_edit`) and advances `Project.current_version`. `scene_json` is
        re-validated from scratch here regardless of the fact that a
        provider produced it earlier. `base_version_id` is checked for
        staleness under the same row lock used to create the version.
        Idempotent via optional `client_request_id`: a replayed accept for
        the same proposal returns the already-created version (`200`)
        rather than creating a second one.
      x-access: owner
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcceptAIProposalInput" }
      responses:
        "200":
          description: A version already existing for this `client_request_id` was returned instead of creating a duplicate.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SceneVersion" }
        "201":
          description: New current version created from the accepted proposal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SceneVersion" }
        "400":
          description: Request body failed validation, or `scene_json` is not an object.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIErrorBody" }
        "404":
          description: Does not exist, or exists but isn't the caller's.
        "409":
          description: "`base_version_id` no longer matches the project's current version."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIErrorBody" }
        "422":
          description: "`scene_json` failed schema/limits validation."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIErrorBody" }

  /api/ai/runs/:
    post:
      tags: [AI]
      operationId: startAIRun
      summary: Start an owner-scoped plan/validate/revise AI run
      description: |
        For `scope: add_layer`, `assets` contains metadata-only browser-local
        media descriptors. At most ten descriptors are accepted and the one
        selected target id must match one descriptor id. Bytes are never sent
        to Django. The provider may create exactly one new layer containing
        one image shape that references that descriptor.
      x-access: owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/AIRunStartInput"
                - type: object
                  properties:
                    assets:
                      type: array
                      maxItems: 10
                      items: { $ref: "#/components/schemas/MediaAssetDescriptor" }
      responses:
        "201":
          description: Run created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AIRun" }
        "400":
          description: Invalid scope, target, or asset descriptors.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Detail" }

